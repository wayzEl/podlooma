# Blueprint for a Web Service with a Background Task Thread on Render's Free Plan

services:
  # The Web Service (FastAPI + Background RQ Worker)
  - type: web
    name: tts-api-service
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # The start command now runs our combined web server and worker process
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: tts-queue
          property: connectionString
      # Set the PYTHON_VERSION to a specific version if needed
      - key: PYTHON_VERSION
        value: 3.9

  # The Redis instance for the queue
  - type: redis
    name: tts-queue
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Allow access from other services in the same Render account
